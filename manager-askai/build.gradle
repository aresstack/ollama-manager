// Model search, download and install code copied unchanged from askai-java8 (Hugging Face + Ollama library,
// local GGUF download, /api/create). Package names are kept so the code stays diffable against askai-java8.
dependencies {
    implementation 'org.jodd:jodd-lagarto:6.0.6'
    implementation 'com.google.code.gson:gson:2.11.0'
    // askai-java8 network configuration (proxy). GraalJS is only needed to evaluate PAC scripts and is not
    // bundled; without it a PAC proxy cannot be evaluated, direct and manual proxies work.
    implementation('com.aresstack:win-proxy-java:0.1.0-beta.4') {
        exclude group: 'org.graalvm.sdk'
        exclude group: 'org.graalvm.js'
    }
    implementation 'com.aresstack:directml-model-catalog:0.2.1'
    implementation 'uk.me.berndporr:iirj:1.7'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    // As in askai-java8: silences the "no SLF4J providers" warning of Jodd's slf4j-api dependency.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'
}

// The copied code is compiled as it is; its own warnings are not ours to fix here.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.removeAll { it.startsWith('-Xlint') || it == '-Werror' }
    options.compilerArgs << '-nowarn'
}
