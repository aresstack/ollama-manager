name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Java 8 build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
      - name: Show Java runtime
        run: java -version
      - name: Build, test and smoke-test the executable JAR on Java 8
        run: ./gradlew clean build --no-daemon --console=plain
      - name: Upload distribution
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ollama-manager-zip
          path: manager-swing/build/distributions/*.zip
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
