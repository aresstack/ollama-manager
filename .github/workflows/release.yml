name: Release

# Publishes a GitHub release with the executable fat jar on every push to main
# (template: the former release workflow of askai-java8).
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0 (default: <major.minor of build.gradle>.<run number>)'
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build Java 8 Ollama Manager
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Resolve release version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          else
            BASE=$(sed -n "s/.*?: '\([0-9]*\.[0-9]*\)\..*/\1/p" build.gradle | head -1)
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=v${VERSION}" >> "${GITHUB_ENV}"
          echo "Release ${VERSION}"

      - name: Build Java 8 fat jar
        run: |
          ./gradlew --no-daemon --console=plain clean build -PreleaseVersion="${VERSION}"
          cp manager-swing/build/executable/ollama-manager.jar "ollama-manager-${VERSION}.jar"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-manager-${{ env.VERSION }}
          path: ollama-manager-${{ env.VERSION }}.jar
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Ollama Manager ${{ env.TAG }}
          generate_release_notes: true
          files: |
            ollama-manager-${{ env.VERSION }}.jar
            manager-swing/build/distributions/ollama-manager-${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
