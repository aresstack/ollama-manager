// Root build owned by the coordinator. Feature branches must not change this file without agreement.

allprojects {
    group = 'com.aresstack.ollamamanager'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all' << '-Xlint:-options' << '-Werror'
        // On a newer JDK (for example an IDE running Gradle on Java 17), compile against the Java 8 API so the
        // build sees exactly what Java 8 sees and APIs deprecated only in later JDKs do not trip -Werror.
        if (JavaVersion.current().isJava9Compatible()) {
            options.release = 8
            // Newer javac adds serial checks for Swing fields that Java 8 javac does not report.
            options.compilerArgs << '-Xlint:-serial'
            if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_21)) {
                // Java 21 adds the this-escape check, which Java 8 javac does not know.
                options.compilerArgs << '-Xlint:-this-escape'
            }
        }
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }

    test {
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }
}

// Verify the dependency direction on source level in addition to the Gradle project graph.
def forbiddenImports = [
    'manager-domain'     : ['javax.swing', 'java.awt', 'java.net.HttpURLConnection', 'java.net.URLConnection',
                            'java.lang.ProcessBuilder', 'com.aresstack.ollamamanager.application',
                            'com.aresstack.ollamamanager.infrastructure', 'com.aresstack.ollamamanager.swing'],
    'manager-application': ['javax.swing', 'java.awt', 'java.net.HttpURLConnection', 'java.net.URLConnection',
                            'com.aresstack.ollamamanager.infrastructure', 'com.aresstack.ollamamanager.swing'],
    'manager-infrastructure': ['javax.swing', 'java.awt', 'com.aresstack.ollamamanager.swing']
]

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Fails when a module imports a package its layer must not know.'
    def checks = forbiddenImports.collectEntries { module, prefixes ->
        [(project(":$module").file('src/main/java')): prefixes]
    }
    inputs.files(checks.keySet().collect { fileTree(it) })
    doLast {
        def violations = []
        checks.each { dir, prefixes ->
            fileTree(dir).include('**/*.java').each { file ->
                file.readLines().findAll { it.startsWith('import ') }.each { line ->
                    if (prefixes.any { line.contains(' ' + it) || line.contains('static ' + it) }) {
                        violations << "${file}: ${line.trim()}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Architecture violations:\n" + violations.join('\n'))
        }
    }
}

subprojects {
    tasks.matching { it.name == 'check' }.configureEach {
        dependsOn rootProject.tasks.named('verifyArchitecture')
    }
}

// The third-party library list of Help > About (oss-licenses.json in manager-askai's resources), as in askai.
ext.ossLicenseTargetProjectPath = ':manager-askai'
apply from: "$rootDir/gradle/oss-licenses.gradle"
